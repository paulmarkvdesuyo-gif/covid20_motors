<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Cart - Co_vid 20's Motor Parts</title>
    <meta name="theme-color" content="#c65a0a">
    <link rel="manifest" href="site.webmanifest">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        a { text-decoration: none; }
        button, input, select, textarea { font: inherit; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px 60px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            color: #1f2937;
        }

        .brand-icon {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ff9f43, #e67e22);
            color: white;
            font-size: 22px;
        }

        .brand-text small {
            display: block;
            font-size: 11px;
            color: #6b7280;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .brand-text strong {
            font-size: 22px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            border-radius: 999px;
            padding: 12px 22px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .btn:hover { transform: translateY(-1px); }

        .btn-secondary {
            background: #edf2f7;
            color: #1f2937;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e67e22, #d35400);
            color: white;
        }

        .btn-danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .page-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
            padding: 24px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e5e7eb;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .page-header h1 {
            margin: 0;
            font-size: clamp(1.8rem, 2vw, 2.5rem);
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 1.5fr 0.9fr;
            gap: 24px;
        }

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 110px 1fr auto;
            gap: 18px;
            background: #fff;
            border: 1px solid #edf2f7;
            border-radius: 18px;
            padding: 14px;
            align-items: center;
        }

        .product-thumb {
            width: 110px;
            height: 110px;
            border-radius: 16px;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 32px;
            overflow: hidden;
        }

        .product-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .product-meta h3 {
            margin: 0 0 6px;
            font-size: 1.05rem;
        }

        .product-meta p {
            margin: 0;
            color: #6b7280;
            font-size: 0.9rem;
        }

        .product-price {
            font-weight: 800;
            color: #e67e22;
            margin-top: 6px;
        }

        .qty-box {
            display: inline-flex;
            align-items: center;
            border: 1px solid #e5e7eb;
            border-radius: 999px;
            overflow: hidden;
            margin-top: 12px;
        }

        .qty-btn {
            width: 34px;
            height: 34px;
            border: none;
            background: #f3f4f6;
            cursor: pointer;
            color: #374151;
            font-weight: 700;
        }

        .qty-value {
            width: 54px;
            text-align: center;
            border: none;
            background: transparent;
            font-weight: 700;
            color: #1f2937;
        }

        .item-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        .line-total {
            font-weight: 800;
            font-size: 1.08rem;
            color: #111827;
        }

        .remove-btn {
            border: none;
            background: transparent;
            color: #dc2626;
            cursor: pointer;
            font-weight: 600;
        }

        .summary-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 22px;
            padding: 22px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .summary-box h2 {
            margin-top: 0;
            margin-bottom: 18px;
            font-size: 1.4rem;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            color: #374151;
        }

        .summary-row.total {
            margin-top: 8px;
            padding-top: 16px;
            border-top: 1px solid #dbe1ea;
            font-size: 1.25rem;
            font-weight: 800;
            color: #111827;
        }

        .shipping-note {
            margin: 16px 0 18px;
            font-size: 0.86rem;
            color: #6b7280;
            background: #eefbf3;
            border: 1px solid #bbf7d0;
            color: #166534;
            padding: 10px 12px;
            border-radius: 12px;
        }

        .checkout-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 16px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field-group label {
            font-size: 0.82rem;
            font-weight: 700;
            color: #374151;
        }

        .field-group input,
        .field-group textarea,
        .field-group select {
            width: 100%;
            border: 1px solid #dfe7f1;
            border-radius: 12px;
            padding: 11px 12px;
            background: white;
            font-size: 0.95rem;
        }

        .field-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        .checkout-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .checkout-actions .btn {
            flex: 1;
            min-width: 120px;
        }

        .empty-state {
            background: white;
            border: 1px dashed #d7deea;
            border-radius: 20px;
            padding: 48px 20px;
            text-align: center;
            color: #6b7280;
        }

        .empty-state i {
            font-size: 52px;
            color: #cbd5e1;
            margin-bottom: 16px;
            display: inline-block;
        }

        .toast {
            position: fixed;
            right: 22px;
            bottom: 22px;
            background: #111827;
            color: white;
            padding: 12px 16px;
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.18);
            display: none;
            z-index: 1200;
            max-width: 320px;
        }

        .toast.error { background: #dc2626; }
        .toast.success { background: #16a34a; }

        @media (max-width: 900px) {
            .cart-layout {
                grid-template-columns: 1fr;
            }

            .summary-box {
                position: static;
            }
        }

        @media (max-width: 560px) {
            .cart-item {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .product-thumb {
                width: 100%;
                height: 180px;
            }

            .item-actions {
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <div class="brand" onclick="window.location.href='shop.html'" style="cursor:pointer;">
                <div class="brand-icon"><i class="fas fa-motorcycle"></i></div>
                <div class="brand-text">
                    <small>Co_vid 20's</small>
                    <strong>Motor Parts</strong>
                </div>
            </div>

            <div class="nav-actions">
                <button class="btn btn-secondary" onclick="window.location.href='shop.html'">
                    <i class="fas fa-arrow-left"></i> Continue Shopping
                </button>
                <button class="btn btn-secondary" onclick="window.location.href='orders.html'">
                    <i class="fas fa-box"></i> My Orders
                </button>
            </div>
        </div>

        <div class="page-card">
            <div class="page-header">
                <h1><i class="fas fa-shopping-cart"></i> My Cart</h1>
                <div id="cartMeta" style="color:#6b7280; font-weight:600;">0 items</div>
            </div>

            <div class="cart-layout">
                <div id="cartItemsContainer" class="cart-items"></div>

                <aside class="summary-box">
                    <h2>Order Summary</h2>

                    <div class="summary-row">
                        <span>Subtotal</span>
                        <strong id="subtotalValue">₱0.00</strong>
                    </div>
                    <div class="summary-row">
                        <span>Shipping</span>
                        <strong id="shippingValue">₱0.00</strong>
                    </div>
                    <div class="summary-row total">
                        <span>Total</span>
                        <strong id="totalValue">₱0.00</strong>
                    </div>

                    <div class="shipping-note">
                        <i class="fas fa-truck"></i> Free shipping on orders above ₱2,000.
                    </div>

                    <div class="checkout-form">
                        <div class="field-group">
                            <label>Full Name</label>
                            <input id="deliveryFullname" type="text" placeholder="Your full name" />
                        </div>
                        <div class="field-group">
                            <label>Phone</label>
                            <input id="deliveryPhone" type="tel" placeholder="09XXXXXXXXX" />
                        </div>
                        <div class="field-group">
                            <label>Email</label>
                            <input id="deliveryEmail" type="email" placeholder="you@example.com" />
                        </div>
                        <div class="field-group">
                            <label>Delivery Address</label>
                            <textarea id="deliveryAddress" placeholder="House no., street, barangay"></textarea>
                        </div>
                        <div class="field-group">
                            <label>City / Municipality</label>
                            <input id="deliveryCity" type="text" placeholder="City" />
                        </div>
                        <div class="field-group">
                            <label>Province</label>
                            <input id="deliveryProvince" type="text" placeholder="Province" />
                        </div>
                        <div class="field-group">
                            <label>ZIP / Postal Code</label>
                            <input id="deliveryZip" type="text" placeholder="Optional" />
                        </div>
                        <div class="field-group">
                            <label>Delivery Instructions</label>
                            <textarea id="deliveryInstructions" placeholder="Optional notes for the courier"></textarea>
                        </div>
                    </div>

                    <div class="checkout-actions">
                        <button id="checkoutBtn" class="btn btn-primary" onclick="checkout()">
                            <i class="fas fa-credit-card"></i> Place Order
                        </button>
                        <button class="btn btn-secondary" onclick="clearCart()">
                            <i class="fas fa-trash"></i> Clear Cart
                        </button>
                    </div>
                </aside>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const user = JSON.parse(localStorage.getItem('shopUser') || 'null');

        if (!user || !user.id) {
            window.location.href = 'index.html';
        }

        let cart = JSON.parse(localStorage.getItem('shopCart') || '[]');

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.style.display = 'block';
            clearTimeout(showToast.timeoutId);
            showToast.timeoutId = setTimeout(() => {
                toast.style.display = 'none';
            }, 3200);
        }

        function formatMoney(value) {
            return '₱' + Number(value || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function resolveCartImageUrl(image) {
            if (!image || image === 'null' || image === 'undefined') return '';
            if (image.startsWith('http://') || image.startsWith('https://') || image.startsWith('data:image')) return image;
            return new URL('../' + image.replace(/^\/+/, ''), window.location.href).href;
        }

        function loadUserProfile() {
            const fullname = document.getElementById('deliveryFullname');
            const phone = document.getElementById('deliveryPhone');
            const email = document.getElementById('deliveryEmail');
            const address = document.getElementById('deliveryAddress');
            const city = document.getElementById('deliveryCity');
            const province = document.getElementById('deliveryProvince');

            fullname.value = user.fullname || '';
            phone.value = user.phone || '';
            email.value = user.email || '';
            address.value = user.address || '';

            if (!city.value) city.value = user.city || '';
            if (!province.value) province.value = user.province || '';
        }

        function renderCart() {
            const container = document.getElementById('cartItemsContainer');

            if (!cart || cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-shopping-bag"></i>
                        <h3>Your cart is empty</h3>
                        <p>Add some motorcycle parts to continue.</p>
                        <button class="btn btn-primary" style="margin-top:14px;" onclick="window.location.href='shop.html'">Shop Now</button>
                    </div>
                `;
                document.getElementById('cartMeta').textContent = '0 items';
                document.getElementById('subtotalValue').textContent = '₱0.00';
                document.getElementById('shippingValue').textContent = '₱0.00';
                document.getElementById('totalValue').textContent = '₱0.00';
                return;
            }

            let subtotal = 0;
            container.innerHTML = cart.map(item => {
                const price = Number(item.price || 0);
                const qty = Number(item.quantity || 1);
                const itemTotal = price * qty;
                subtotal += itemTotal;

                const image = resolveCartImageUrl(item.image);
                const imageHtml = image
                    ? `<img src="${image}" alt="${escapeHtml(item.name || 'Product')}" onerror="this.style.display='none';this.parentElement.innerHTML='<div style=\'font-size:32px;\'>📦</div>'">`
                    : '<div style="font-size:32px;">📦</div>';

                return `
                    <div class="cart-item">
                        <div class="product-thumb">${imageHtml}</div>
                        <div class="product-meta">
                            <h3>${escapeHtml(item.name || 'Product')}</h3>
                            <p>Unit Price: ${formatMoney(price)}</p>
                            <div class="qty-box">
                                <button class="qty-btn" type="button" onclick="changeQty(${item.product_id || item.id}, -1)">-</button>
                                <input class="qty-value" type="number" min="1" value="${qty}" onchange="setQty(${item.product_id || item.id}, this.value)" />
                                <button class="qty-btn" type="button" onclick="changeQty(${item.product_id || item.id}, 1)">+</button>
                            </div>
                        </div>
                        <div class="item-actions">
                            <div class="line-total">${formatMoney(itemTotal)}</div>
                            <button class="remove-btn" type="button" onclick="removeFromCart(${item.product_id || item.id})">Remove</button>
                        </div>
                    </div>
                `;
            }).join('');

            const totalItems = cart.reduce((sum, item) => sum + Number(item.quantity || 1), 0);
            const shipping = subtotal > 2000 ? 0 : 120;
            const total = subtotal + shipping;

            document.getElementById('cartMeta').textContent = `${totalItems} ${totalItems === 1 ? 'item' : 'items'}`;
            document.getElementById('subtotalValue').textContent = formatMoney(subtotal);
            document.getElementById('shippingValue').textContent = formatMoney(shipping);
            document.getElementById('totalValue').textContent = formatMoney(total);
        }

        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, (char) => {
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
                return map[char] || char;
            });
        }

        function saveCart() {
            localStorage.setItem('shopCart', JSON.stringify(cart));
        }

        function changeQty(productId, delta) {
            const item = cart.find(i => Number(i.product_id || i.id) === Number(productId));
            if (!item) return;

            const nextQty = Number(item.quantity || 1) + delta;
            if (nextQty <= 0) {
                removeFromCart(productId);
                return;
            }

            item.quantity = nextQty;
            saveCart();
            renderCart();
        }

        function setQty(productId, newValue) {
            const item = cart.find(i => Number(i.product_id || i.id) === Number(productId));
            if (!item) return;

            let qty = Number(newValue || 1);
            if (!Number.isFinite(qty) || qty < 1) qty = 1;
            item.quantity = qty;
            saveCart();
            renderCart();
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => Number(item.product_id || item.id) !== Number(productId));
            saveCart();
            renderCart();
            showToast('Item removed from cart', 'success');
        }

        function clearCart() {
            if (!cart.length) {
                showToast('Your cart is already empty', 'success');
                return;
            }

            if (!confirm('Clear your cart?')) return;
            cart = [];
            saveCart();
            renderCart();
            showToast('Cart cleared', 'success');
        }

        async function checkout() {
            if (!cart || cart.length === 0) {
                showToast('Your cart is empty', 'error');
                return;
            }

            const fullname = document.getElementById('deliveryFullname').value.trim();
            const phone = document.getElementById('deliveryPhone').value.trim();
            const email = document.getElementById('deliveryEmail').value.trim();
            const address = document.getElementById('deliveryAddress').value.trim();
            const city = document.getElementById('deliveryCity').value.trim();
            const province = document.getElementById('deliveryProvince').value.trim();
            const zip = document.getElementById('deliveryZip').value.trim();
            const instructions = document.getElementById('deliveryInstructions').value.trim();

            if (!fullname) { showToast('Please enter your full name', 'error'); return; }
            if (!phone) { showToast('Please enter your phone number', 'error'); return; }
            if (!email) { showToast('Please enter your email', 'error'); return; }
            if (!address) { showToast('Please enter your delivery address', 'error'); return; }
            if (!city) { showToast('Please enter your city/municipality', 'error'); return; }
            if (!province) { showToast('Please enter your province', 'error'); return; }

            const deliveryAddress = [address, city, province, zip].filter(Boolean).join(', ');

            const btn = document.getElementById('checkoutBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

            try {
                const response = await fetch('api_place_order.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: user.id,
                        user_lookup: {
                            email: user.email || email,
                            username: user.username || ''
                        },
                        cart: cart,
                        address: deliveryAddress + (instructions ? ` (${instructions})` : ''),
                        payment_method: 'cash',
                        delivery_info: {
                            fullname,
                            phone,
                            email,
                            city,
                            province,
                            zip,
                            instructions
                        }
                    })
                });

                const data = await response.json();

                if (data.success) {
                    cart = [];
                    localStorage.setItem('shopCart', JSON.stringify(cart));
                    showToast('Order placed successfully!', 'success');
                    setTimeout(() => {
                        window.location.href = 'orders.html';
                    }, 1200);
                    return;
                }

                showToast(data.message || 'Checkout failed', 'error');
            } catch (error) {
                console.error('Checkout error:', error);
                showToast('Checkout failed. Please try again.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-credit-card"></i> Place Order';
            }
        }

        loadUserProfile();
        renderCart();
    </script>
</body>
</html>
